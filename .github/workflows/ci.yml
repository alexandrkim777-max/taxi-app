# Every push and pull request: migrations on a fresh PostGIS database, type checks of all apps,
# the full API test suite, an admin build, and a dependency audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi
          POSTGRES_DB: taxi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxi" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://taxi:taxi@localhost:5432/taxi_test
      NODE_ENV: test
      # Test-only value; production secrets never live in the repository.
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - name: Tests (failures are also posted as annotations, readable without the log)
        run: |
          set -o pipefail
          npm test 2>&1 | tee test.log || {
            grep -E 'not ok|# Subtest|error:|expected:|actual:|\.test\.ts:[0-9]+' test.log | grep -B1 -A12 'not ok' | head -80 \
              | sed 's/%/%25/g' | awk '{ printf "%s%%0A", $0 }' | sed 's/^/::error title=Failed tests::/'
            echo
            exit 1
          }
      - name: The server starts and answers (catches what unit tests do not load)
        run: |
          PORT=3999 PUSH_PROVIDER=log node --experimental-strip-types --no-warnings apps/api/src/server.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3999/health && break; sleep 1; done
          curl -sf localhost:3999/health || (cat server.log; exit 1)
      - name: First-ride check against the running server (the script the test server uses)
        run: |
          # No other drivers on the map in CI: take test drivers off the line so ours is the one asked.
          psql "$DATABASE_URL" -qc "UPDATE driver_presence SET updated_at = now() - interval '20 minutes'"
          CHECK_API_URL=http://localhost:3999 node --experimental-strip-types --no-warnings apps/api/src/tools/first-ride-check.ts
      - name: Admin panel builds without demo data
        run: |
          npm run build --workspace apps/admin
          if grep -rq "Madina Ergasheva" apps/admin/dist/assets; then echo "demo data in the admin build"; exit 1; fi
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        app: [driver, passenger]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run tokens
      - run: npx tsc --noEmit
      - name: The Android JavaScript bundle builds (what the phone build packs)
        run: npx expo export --platform android --output-dir /tmp/bundle
