# Every push and pull request: migrations on a fresh PostGIS database, type checks of all apps,
# the full API test suite, an admin build, and a dependency audit.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: taxi
          POSTGRES_PASSWORD: taxi
          POSTGRES_DB: taxi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U taxi" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://taxi:taxi@localhost:5432/taxi_test
      NODE_ENV: test
      # Test-only value; production secrets never live in the repository.
      AUTH_SECRET: ci-only-not-a-real-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm test
      - name: Admin panel builds without demo data
        run: |
          npm run build --workspace apps/admin
          if grep -rq "Madina Ergasheva" apps/admin/dist/assets; then echo "demo data in the admin build"; exit 1; fi
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        app: [driver, passenger]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run tokens
      - run: npx tsc --noEmit
